<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheila Story - Main Menu</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary-green: #2ed573;
            --accent-glow: rgba(46, 213, 115, 0.4);
            --bg-dark: #0f0f0f;
            --text-main: #ffffff;
            --text-dim: #888888;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-main);
        }

        /* Opening Animation Layers */
        #intro-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeOutIntro 1s ease forwards 3s;
            pointer-events: none;
        }

        .intro-text {
            font-size: 1.5rem;
            letter-spacing: 10px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInText 1.5s ease forwards 0.5s;
        }

        .intro-line {
            width: 0;
            height: 2px;
            background: var(--primary-green);
            margin-top: 10px;
            animation: extendLine 1s ease forwards 1.2s;
        }

        @keyframes fadeInText {
            to { opacity: 1; transform: translateY(-10px); }
        }
        @keyframes extendLine {
            to { width: 200px; }
        }
        @keyframes fadeOutIntro {
            to { opacity: 0; visibility: hidden; }
        }

        /* Background Visuals */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, black 150%);
            pointer-events: none;
            z-index: 2;
        }

        .scanline {
            width: 100%; height: 100%;
            position: absolute;
            background: linear-gradient(to bottom, rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 3;
        }

        /* Menu UI */
        .menu-container {
            text-align: center;
            z-index: 10;
            opacity: 0;
            animation: fadeInMenu 1s ease forwards 3.5s;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 5rem);
            margin-bottom: 40px;
            letter-spacing: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 30px var(--accent-glow);
            font-weight: 900;
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ddd;
            padding: 14px 0;
            font-size: 1rem;
            width: 300px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 4px;
            position: relative;
            overflow: hidden;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .menu-btn:hover::before { left: 100%; }

        .menu-btn:hover {
            background: var(--text-main);
            color: var(--bg-dark);
            box-shadow: 0 0 25px var(--accent-glow);
            transform: translateY(-5px);
            border-color: var(--primary-green);
        }

        .menu-btn.primary-btn {
            border-left: 4px solid var(--primary-green);
        }

        /* Modal Styling */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        #mod-status {
            width: 85%; max-width: 650px;
            height: 180px;
            background: #0a0a0a;
            border: 1px solid #222;
            margin: 25px 0;
            padding: 20px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
        }

        .status-msg { margin-bottom: 6px; display: block; border-left: 2px solid transparent; padding-left: 10px; }
        .err { color: #ff4757; border-color: #ff4757; }
        .ok { color: var(--primary-green); border-color: var(--primary-green); }

        input[type="file"] {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            border: 1px dashed #444;
            color: #888;
            cursor: pointer;
        }

        @keyframes fadeInMenu { to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- Opening Animation -->
    <div id="intro-layer">
        <div class="intro-text">MC² Engine</div>
        <div class="intro-line"></div>
    </div>

    <div class="scanline"></div>
    <div class="overlay"></div>

    <div class="menu-container">
        <h1>Sheila Story</h1>
        <div class="menu-options">
            <button class="menu-btn primary-btn" onclick="handleAction('Play')">Mulai Cerita</button>
            <button class="menu-btn" onclick="handleAction('Mod')">Mod Loader</button>
            <button class="menu-btn" onclick="handleAction('ModGu')">Mod Maker</button>
        </div>
    </div>

    <!-- Modal Mod -->
    <div id="mod-modal" class="modal">
        <h2 style="letter-spacing: 5px;">LOAD EXTERNAL MOD</h2>
        <p style="color: var(--text-dim); margin-bottom: 20px;">Pilih file ZIP yang berisi story.json dan folder Asset</p>
        
        <input type="file" id="mod-input" accept=".zip">

        <div id="mod-status">
            <span class="status-msg">System Ready. Awaiting ZIP injection...</span>
        </div>

        <div id="mod-actions" style="display:none;">
            <button class="menu-btn" style="background: var(--primary-green); color: black; border: none; font-weight: bold;" onclick="launchMod()">INITIALIZE MOD</button>
        </div>
        
        <button class="menu-btn" style="margin-top: 20px; width: 180px; font-size: 0.8rem; opacity: 0.6;" onclick="closeModModal()">Kembali</button>
    </div>

    <script>
        let modData = null;
        let modFilesMapping = {};

        function handleAction(action) {
            if (action === 'Play') {
                sessionStorage.setItem('isMod', 'false');
                window.location.href = "game.html";
            } else if (action === 'Mod') {
                document.getElementById('mod-modal').style.display = 'flex';
            } else if (action === 'ModGu') {
                window.location.href = "modmaker.html";
            }
        }

        function closeModModal() {
            document.getElementById('mod-modal').style.display = 'none';
        }

        function logStatus(text, type) {
            const box = document.getElementById('mod-status');
            const span = document.createElement('span');
            span.className = "status-msg " + type;
            span.innerHTML = `> ${text}`;
            box.appendChild(span);
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('mod-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const statusBox = document.getElementById('mod-status');
            const actionArea = document.getElementById('mod-actions');
            statusBox.innerHTML = "<span class='status-msg'>Accessing ZIP Archive...</span>";
            actionArea.style.display = "none";
            modFilesMapping = {};

            try {
                const zip = await JSZip.loadAsync(file);
                // Cari story.json dimanapun lokasinya di dalam ZIP
                const jsonEntry = Object.keys(zip.files).find(name => name.toLowerCase().endsWith("story.json"));
                
                if (!jsonEntry) {
                    logStatus("ERROR: story.json is missing from archive.", "err");
                    return;
                }

                modData = JSON.parse(await zip.file(jsonEntry).async("string"));
                logStatus("story.json decoded successfully.", "ok");

                const promises = [];
                zip.forEach((path, entry) => {
                    if (!entry.dir && path.toLowerCase().includes("asset/")) {
                        const p = entry.async("blob").then(blob => {
                            modFilesMapping[path] = URL.createObjectURL(blob);
                        });
                        promises.push(p);
                    }
                });

                await Promise.all(promises);
                logStatus(`Assets verified: ${Object.keys(modFilesMapping).length} files indexed.`, "ok");
                actionArea.style.display = "block";

            } catch (err) {
                logStatus("CRITICAL ERROR: Failed to parse ZIP file.", "err");
                console.error(err);
            }
        });

        function launchMod() {
            sessionStorage.setItem('isMod', 'true');
            sessionStorage.setItem('modData', JSON.stringify(modData));
            sessionStorage.setItem('modFiles', JSON.stringify(modFilesMapping));
            window.location.href = "game.html";
        }
    </script>
</body>
</html>
